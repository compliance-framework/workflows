# Agent config for the stack smoke test (smoke/compose.yaml). This file is a template:
# smoke/run.sh replaces ${SMOKE_PLUGIN_TAG} and ${SMOKE_POLICY_TAG} with the validated tags
# and mounts the result (the agent does not expand variables in plugin sources or policies).
# The agent registers its instance (config report at startup), heartbeats every minute and
# runs one plugin every minute; smoke/run.sh checks that the plugin's evidence reaches the API.
# api.auth comes from CCF_API_AUTH_CLIENT_ID / CCF_API_AUTH_CLIENT_SECRET (smoke/run.sh).
daemon: true
verbosity: 1

api:
  url: http://api:8080

remote_config:
  mode: report

agent_evidence:
  enabled: true
  interval: 1h

plugins:
  # Public images, pulled anonymously. The plugin's OCI index carries the
  # org.ccf.plugin.protocol.version=2 annotation, so the agent picks protocol v2 on its own.
  file_attestation:
    source: ghcr.io/compliance-framework/plugin-file-attestation:${SMOKE_PLUGIN_TAG}
    policies:
      - ghcr.io/compliance-framework/plugin-file-attestation-policies:${SMOKE_POLICY_TAG}
    # The shortest schedule the agent accepts: the first run is at the next full minute.
    schedule: "* * * * *"
    config:
      # smoke/fixtures, mounted read-only by smoke/compose.yaml. No attestation_path or
      # authorized_signers: both are optional and the check needs only the evidence.
      file_path: /etc/ccf-agent/fixtures/attested-file.txt
