# actionlint configuration (https://github.com/rhysd/actionlint/blob/main/docs/config.md).
paths:
  # actionlint v1.7.12 predates the job.workflow_* contexts (docs: "Contexts reference", job).
  .github/workflows/*.yml:
    ignore:
      - 'property "workflow_(repository|sha|ref|file_path)" is not defined in object type'
