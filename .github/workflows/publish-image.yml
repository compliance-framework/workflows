# Builds the caller's images and pushes them to ghcr.io/<owner>/<name>:<tag> for each given tag,
# with GITHUB_TOKEN. Called by preview.yml (and by the release workflows); callers grant
# contents: read and packages: write. Builds linux/amd64 only for now.
name: publish-image

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list of {"name", "dockerfile", "context"}; name defaults to the repo name, dockerfile to Dockerfile, context to .'
        type: string
        default: '[{}]'
      tags:
        description: "Space-separated tags without the repository, e.g. 'main sha-0123456'"
        type: string
        required: true

permissions: {}

jobs:
  publish:
    name: publish (${{ matrix.image.name || github.event.repository.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the image references
        id: refs
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name || github.event.repository.name }}
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${OWNER,,}/${NAME,,}"
          refs=""
          for tag in $TAGS; do
            if ! [[ "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::invalid image tag '$tag'"
              exit 1
            fi
            refs="$refs$image:$tag,"
          done
          if [ -z "$refs" ]; then
            echo "::error::no tags to publish"
            exit 1
          fi
          echo "Publishing ${refs%,}"
          echo "refs=${refs%,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile || 'Dockerfile' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.refs.outputs.refs }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
