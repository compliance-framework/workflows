# Publishes a chart release (kind helm) when the caller's release is published: picks the chart
# from the release-please tag (<chart>-vX.Y.Z in a multi-chart repo, vX.Y.Z with one chart),
# packages it at the tag's version and pushes it to the OCI registry (default
# oci://ghcr.io/compliance-framework/helm-charts). release-finished.yml reports the result.
# Call it on `release: published` with `secrets: inherit`; see README. Rules: internal/release.
name: release-helm

on:
  workflow_call:
    inputs:
      charts-dir:
        description: "Directory holding one directory per chart"
        type: string
        default: charts
      registry:
        description: "OCI registry the chart is pushed to"
        type: string
        default: oci://ghcr.io/compliance-framework/helm-charts
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID"
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key"
        required: true

permissions: {}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tools ref
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so cmd/release can't be fetched"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ccf-workflows
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ccf-workflows/go.mod
          cache: false
      - name: Choose the chart
        id: chart
        env:
          TAG: ${{ github.event.release.tag_name }}
          CHARTS_DIR: ${{ inputs.charts-dir }}
        run: |
          go -C .ccf-workflows build -o "$RUNNER_TEMP/release" ./cmd/release
          "$RUNNER_TEMP/release" chart --tag "$TAG" --charts-dir "$CHARTS_DIR"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.0
      # At the tag's version: a release candidate is tagged on the default branch, whose
      # Chart.yaml still has the previous version until the release PR merges.
      - name: Package and push the chart
        env:
          CHART_PATH: ${{ steps.chart.outputs.path }}
          NAME: ${{ steps.chart.outputs.name }}
          VERSION: ${{ steps.chart.outputs.version }}
          REGISTRY: ${{ inputs.registry }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          host="${REGISTRY#oci://}"
          host="${host%%/*}"
          helm registry login "$host" --username "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          helm package "$CHART_PATH" --version "$VERSION" --destination "$RUNNER_TEMP/charts"
          helm push "$RUNNER_TEMP/charts/$NAME-$VERSION.tgz" "$REGISTRY"
          echo "Pushed $REGISTRY/$NAME:$VERSION." | tee -a "$GITHUB_STEP_SUMMARY"

  finished:
    name: finished
    needs: [publish]
    if: always()
    # A local reference in a called workflow resolves to this repo at the same commit (README).
    uses: ./.github/workflows/release-finished.yml
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      packages: write
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
