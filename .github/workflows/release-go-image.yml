# Publishes a release's container images (kind go-service; agent has three) when the caller's
# release is published: for the tag vX.Y.Z, ghcr.io/<owner>/<name>:X.Y.Z, :X.Y, :X and :latest;
# a pre-release (vX.Y.Z-rcN) gets :X.Y.Z-rcN only. Each image is built natively for amd64 and
# arm64 (publish-image.yml), then release-finished.yml reports the result. Call it on
# `release: published` with `secrets: inherit`; see README. Tag rules: internal/release.
name: release-go-image

on:
  workflow_call:
    inputs:
      images:
        description: 'JSON list of {"name", "dockerfile", "context"}; name defaults to the repo name, dockerfile to Dockerfile, context to .'
        type: string
        default: '[{}]'
      tag-prefix:
        description: "Prefix of the release tags"
        type: string
        default: v
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID"
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key"
        required: true

permissions: {}

jobs:
  tags:
    name: tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Check the tools ref
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so cmd/release can't be fetched"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Choose the tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: go run ./cmd/release release-tags --tag "$TAG" --prefix "$PREFIX" --style image

  image:
    name: image
    needs: [tags]
    # A local reference in a called workflow resolves to this repo at the same commit (README).
    uses: ./.github/workflows/publish-image.yml
    with:
      images: ${{ inputs.images }}
      tags: ${{ needs.tags.outputs.tags }}
    permissions:
      contents: read
      packages: write

  finished:
    name: finished
    needs: [tags, image]
    if: always()
    uses: ./.github/workflows/release-finished.yml
    with:
      needs: ${{ toJSON(needs) }}
      images: ${{ inputs.images }}
    permissions:
      packages: write
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
