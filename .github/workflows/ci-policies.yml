# CI for Rego policy repos (kind policies). Calls ci-common.yml and ends in the `required`
# job, the one status check to require. Callers grant the permissions ci-common.yml needs
# (actions: read, contents: read, pull-requests: read, security-events: write); see README.
name: ci-policies

on:
  workflow_call:
    inputs:
      directory:
        description: "Directory holding the policies (the bundle root)"
        type: string
        default: policies
      opa-version:
        description: "OPA version, without the leading v"
        type: string
        default: "1.21.3"
      regal-version:
        description: "Regal version, without the leading v"
        type: string
        default: "0.43.0"

permissions: {}

jobs:
  common:
    name: common
    # A local reference in a called workflow resolves to this repo at the same commit (README).
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    uses: ./.github/workflows/ci-common.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write

  opa:
    name: opa
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      POLICY_DIR: ${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        id: setup
        with:
          version: ${{ inputs.opa-version }}
      # Each check runs even when an earlier one failed, so one run reports all of them.
      - name: opa fmt
        run: |
          if ! opa fmt --list --fail "$POLICY_DIR"; then
            echo "::error::policies need opa fmt (run opa fmt -w $POLICY_DIR)"
            opa fmt --diff "$POLICY_DIR" || true
            exit 1
          fi
      - name: opa check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: opa check --strict "$POLICY_DIR"
      - name: opa test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: opa test "$POLICY_DIR"
      - name: opa build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: opa build --bundle "$POLICY_DIR" --output "$RUNNER_TEMP/bundle.tar.gz"

  regal:
    name: regal
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: ${{ inputs.regal-version }}
      - name: Find the repo's Regal config
        id: config
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          for f in .regal/config.yaml .regal.yaml; do
            if [ -f "$f" ]; then
              echo "Using the repo's $f."
              echo "shared=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No Regal config in the repo; using the shared base config."
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so the shared config can't be fetched"
            exit 1
          fi
          echo "shared=true" >> "$GITHUB_OUTPUT"
      - name: Check out the shared config
        if: steps.config.outputs.shared == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ccf-workflows
          sparse-checkout: .regal/config.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: regal lint
        env:
          SHARED: ${{ steps.config.outputs.shared }}
          POLICY_DIR: ${{ inputs.directory }}
        run: |
          args=()
          if [ "$SHARED" = "true" ]; then
            cfg="$RUNNER_TEMP/ccf-regal.yaml"
            # Moved out of the tree so Regal doesn't lint the clone.
            mv .ccf-workflows/.regal/config.yaml "$cfg"
            rm -rf .ccf-workflows
            # Regal reads only .rego files, so a policy reading a value from the bundle's data
            # files gets unresolved-reference. A data file in <dir>/a/b puts its top-level keys
            # at data.a.b.<key>; those paths (and anything below them) become the rule's
            # except-paths. A path segment that isn't a plain identifier never reaches the rule
            # (Regal cuts the reference at its first [), so it's left out.
            except=""
            while IFS= read -r -d '' f; do
              rel="${f#"$POLICY_DIR"}"
              rel="$(dirname "${rel#/}")"
              prefix=data
              if [ "$rel" != . ]; then
                prefix="data.${rel//\//.}"
              fi
              if ! [[ "$prefix" =~ ^data(\.[A-Za-z_][A-Za-z0-9_]*)*$ ]]; then
                continue
              fi
              format=yaml
              if [[ "$f" == *.json ]]; then
                format=json
              fi
              except+="$(PREFIX="$prefix" yq -p "$format" -o yaml \
                'select(tag == "!!map") | keys | .[] | select(test("^[A-Za-z_][A-Za-z0-9_]*$")) | strenv(PREFIX) + "." + .' "$f")"$'\n'
            done < <(find "$POLICY_DIR" -type f \( -name data.json -o -name data.yaml -o -name data.yml \) -print0)
            except="$(sort -u <<< "$except" | sed '/^$/d')"
            if [ -n "$except" ]; then
              echo "Data paths Regal treats as known:"
              echo "$except"
              EXCEPT="$(jq -R '., . + ".**"' <<< "$except" | jq -sc .)" \
                yq -i '.rules.imports."unresolved-reference"."except-paths" += env(EXCEPT)' "$cfg"
            fi
            args=(--config-file "$cfg")
          fi
          regal lint "${args[@]}" --format github "$POLICY_DIR"

  required:
    name: required
    needs: [common, opa, regal]
    # Skipped, not failed, on a closed PR, like the jobs above.
    if: ${{ always() && !(github.event_name == 'pull_request' && github.event.pull_request.state == 'closed') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The jobs above skip only on a closed PR, where this job skips too, so anything but
      # success fails (jobs ci-common skips on push events are inside `common`, whose result
      # is still success).
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs succeeded."
