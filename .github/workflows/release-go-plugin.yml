# Publishes a plugin release (kind go-plugin) when the caller's release is published:
# goreleaser builds the archives and attaches them to the GitHub release, then gooci uploads
# them once to ghcr.io/<owner>/<repo>:vX.Y.Z, annotated with the plugin protocol version, and
# for a final tag (decided from the tag name, never from the release's prerelease flag) crane
# points :latest at that same manifest, so both tags have one digest (checked here).
# release-finished.yml reports the result. Call it on `release: published` with
# `secrets: inherit`; the caller's goreleaser config needs `release.prerelease: auto`
# (checked here). See README. Tag rules: internal/release (ReleaseTags).
name: release-go-plugin

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: "Prefix of the release tags"
        type: string
        default: v
      protocol-version:
        description: "The agent plugin protocol version the plugin implements (org.ccf.plugin.protocol.version)"
        type: string
        default: "2"
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID (the caller\'s `release` environment secret is used first)"
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key (the caller\'s `release` environment secret is used first)"
        required: false

permissions: {}

jobs:
  tags:
    name: tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Check the tools ref
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so cmd/release can't be fetched"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Choose the tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: go run ./cmd/release release-tags --tag "$TAG" --prefix "$PREFIX" --style artifact

  publish:
    name: publish
    needs: [tags]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # goreleaser attaches the archives to the release
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tags for its changelog
          persist-credentials: false
      # goreleaser updates the existing release with `prerelease` from its config, so anything
      # but auto (decided from the tag) would turn a release candidate into a full release.
      - name: Check the goreleaser config
        run: |
          config=""
          # goreleaser's own search order.
          for f in .config/goreleaser.yml .config/goreleaser.yaml .goreleaser.yml .goreleaser.yaml goreleaser.yml goreleaser.yaml; do
            if [ -f "$f" ]; then
              config="$f"
              break
            fi
          done
          if [ -z "$config" ]; then
            echo "::error::no goreleaser config (.goreleaser.yaml) in the repo"
            exit 1
          fi
          prerelease="$(yq -r '.release.prerelease // ""' "$config")"
          if [ "$prerelease" != "auto" ]; then
            echo "::error file=$config::release.prerelease must be auto (it is '$prerelease'), so a release candidate stays a pre-release"
            exit 1
          fi
          mode="$(yq -r '.release.mode // ""' "$config")"
          if [ -n "$mode" ] && [ "$mode" != "keep-existing" ]; then
            echo "::warning file=$config::release.mode is $mode: goreleaser changes the release notes release-please wrote"
          fi
          if [ "$(yq -r '.release.replace_existing_artifacts // false' "$config")" != "true" ]; then
            echo "::warning file=$config::release.replace_existing_artifacts is not true: re-running a release that uploaded some archives fails"
          fi
          echo "Using $config."
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install gooci
        run: go install github.com/compliance-framework/gooci@v0.0.7
      # crane (go-containerregistry, the library gooci is built on) points the other tags at the
      # uploaded manifest. v0.20.7 is the newest release that needs no Go above gooci's 1.24.
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
      # gooci and crane read the Docker credentials (the default keychain).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upload the plugin
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          PROTOCOL_VERSION: ${{ inputs.protocol-version }}
        run: |
          [ -n "$TAGS" ] || { echo "::error::no tags to publish"; exit 1; }
          # Once, to the first (most specific) tag: each upload makes a new manifest, so the
          # other tags are pointed at this one by the next step.
          read -r tag _ <<<"$TAGS"
          echo "Uploading dist/ to ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          gooci upload --annotate="org.ccf.plugin.protocol.version=$PROTOCOL_VERSION" dist/ "ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
      # One build, one digest: the agent records the digest it pulled (_plugin_digest,
      # _policy_digest), so every tag must name the uploaded manifest (a re-upload makes another).
      - name: Tag the rest
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          read -r -a tags <<<"$TAGS"
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::no tags to publish"; exit 1; }
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(crane digest "$repo:${tags[0]}")"
          [ -n "$digest" ] || { echo "::error::no digest for $repo:${tags[0]}"; exit 1; }
          for tag in "${tags[@]:1}"; do
            echo "Tagging $repo@$digest as $tag"
            crane tag "$repo@$digest" "$tag"
          done
          failed=""
          for tag in "${tags[@]}"; do
            got="$(crane digest "$repo:$tag")"
            if [ "$got" != "$digest" ]; then
              echo "::error::$repo:$tag is $got, not $digest (the upload to :${tags[0]})"
              failed=1
            fi
          done
          [ -z "$failed" ] || exit 1
          echo "$repo: ${tags[*]} all at $digest"

  finished:
    name: finished
    needs: [tags, publish]
    if: always()
    # A local reference in a called workflow resolves to this repo at the same commit (README).
    uses: ./.github/workflows/release-finished.yml
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      packages: write
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
