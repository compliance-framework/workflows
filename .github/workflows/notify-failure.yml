# Keeps one Slack thread per CI incident (rules: internal/notify): a failure opens a thread
# or replies in the open one, a pass after a failure replies and closes it.
# Call it from a job with `needs: <CI jobs>`, `if: always()`, `with: {needs: ${{ toJSON(needs) }}}`,
# `secrets: inherit` and `permissions: {contents: read}`; see docs/notify.md.
name: notify-failure

on:
  workflow_call:
    inputs:
      needs:
        description: "toJSON(needs) of the calling job; empty means the run failed (callers that still run it with if: failure())"
        type: string
        default: ""
      channel:
        description: "Slack channel ID for new incidents; empty means the SLACK_CHANNEL_CI_FAILURES variable"
        type: string
        default: ""
      workflows-ref:
        description: "Ref of compliance-framework/workflows to run cmd/notify from, to test another ref; empty means the commit this workflow is called at"
        type: string
        default: ""
    secrets:
      SLACK_BOT_TOKEN:
        description: "Slack bot token (chat:write). Without it the job does nothing, so forks don't fail."
        required: false

permissions: {}

jobs:
  notify:
    name: notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out cmd/notify
    env:
      TOOLS_DIR: ${{ github.workspace }}/.ccf-workflows
      STATE_FILE: .ccf-notify-incident.json
      NEEDS: ${{ inputs.needs }}
    steps:
      - name: Check for the Slack token
        id: token
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -n "${SLACK_BOT_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SLACK_BOT_TOKEN (e.g. a fork); not notifying."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the tools ref
        if: steps.token.outputs.enabled == 'true'
        env:
          REF: ${{ inputs.workflows-ref || job.workflow_sha }}
        run: |
          if [ -z "$REF" ]; then
            echo "::error::job.workflow_sha is empty, so cmd/notify can't be fetched"
            exit 1
          fi
      - name: Check out cmd/notify
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: compliance-framework/workflows
          # By default the commit this workflow file was called at (a caller's @<sha> pin).
          ref: ${{ inputs.workflows-ref || job.workflow_sha }}
          path: .ccf-workflows
          persist-credentials: false

      - if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .ccf-workflows/go.mod
          cache: false

      - name: Decide
        id: plan
        if: steps.token.outputs.enabled == 'true'
        run: |
          go -C "$TOOLS_DIR" build -o "$RUNNER_TEMP/notify" ./cmd/notify
          "$RUNNER_TEMP/notify" plan

      # The newest state saved under the incident's key prefix; none means no incident.
      - name: Restore the incident state
        if: steps.plan.outputs.notify == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ steps.plan.outputs.key }}
          restore-keys: ${{ steps.plan.outputs.restore-key }}

      - name: Post to Slack
        id: post
        if: steps.plan.outputs.notify == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.channel || vars.SLACK_CHANNEL_CI_FAILURES }}
        run: '"$RUNNER_TEMP/notify" post'

      - name: Save the incident state
        if: steps.post.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STATE_FILE }}
          key: ${{ steps.plan.outputs.key }}
