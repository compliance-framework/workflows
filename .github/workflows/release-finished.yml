# The tail every release workflow runs, whatever the release's result (call it with
# `if: always()`): sends repository_dispatch `release-finished` (repo, tag, conclusion) to
# compliance-framework/workflows as ccf-release-bot, then prunes the caller's GHCR preview
# tags (sha-*, pr-*) older than 30 days with GITHUB_TOKEN. See README.
name: release-finished

on:
  workflow_call:
    inputs:
      needs:
        description: "toJSON(needs) of the calling job: the release's jobs and their results"
        type: string
        required: true
      images:
        description: 'JSON list of {"name"} whose packages are pruned; name defaults to the repo name'
        type: string
        default: '[{}]'
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID"
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key"
        required: true

permissions: {}

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      TOKEN_REPO: workflows # the only repo the dispatch token may reach
    steps:
      # The release bot is installed on every org repo: a token minted with an owner and no
      # repositories would reach all of them, so refuse anything but one named repo.
      - name: Check the dispatch token scope
        run: |
          if ! [[ "$TOKEN_REPO" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::refusing to mint a release token: repository scope '$TOKEN_REPO' is not one repo"
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: compliance-framework
          repositories: ${{ env.TOKEN_REPO }}
          permission-contents: write # repository_dispatch
      - name: Send release-finished
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEEDS: ${{ inputs.needs }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          # Any failed job fails the release; a skipped job only follows a failed one.
          conclusion="$(jq -r '[.[].result] |
            if any(. == "failure") then "failure"
            elif any(. == "cancelled") then "cancelled"
            elif all(. == "success" or . == "skipped") then "success"
            else "failure" end' <<< "$NEEDS")"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" --arg conclusion "$conclusion" \
            '{event_type: "release-finished", client_payload: {repo: $repo, tag: $tag, conclusion: $conclusion}}' |
            gh api "repos/compliance-framework/$TOKEN_REPO/dispatches" --input -
          echo "Sent release-finished for $GITHUB_REPOSITORY $TAG: $conclusion." | tee -a "$GITHUB_STEP_SUMMARY"

  prune:
    name: prune previews
    needs: [dispatch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Prune old preview tags
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          IMAGES: ${{ inputs.images }}
          MAX_AGE_DAYS: 30
        run: |
          set -o pipefail
          names="$(jq -r --arg repo "$REPO_NAME" '.[] | .name // $repo | ascii_downcase' <<< "$IMAGES" | sort -u)"
          for name in $names; do # image names have no spaces
            pkg="orgs/$OWNER/packages/container/$(jq -rn --arg n "$name" '$n | @uri')"
            if ! versions="$(gh api --paginate "$pkg/versions?per_page=100" --jq '.[]' 2> "$RUNNER_TEMP/gh.err")"; then
              if grep -q 'HTTP 404' "$RUNNER_TEMP/gh.err"; then
                echo "No package $name; nothing to prune."
                continue
              fi
              cat "$RUNNER_TEMP/gh.err" >&2
              exit 1
            fi
            # Only versions every tag of which is a preview tag: one that is also main or a
            # release stays. Untagged versions (e.g. a manifest list's platform images) stay too.
            old="$(jq -r --argjson days "$MAX_AGE_DAYS" 'select(
                (.metadata.container.tags | length > 0)
                and all(.metadata.container.tags[]; test("^(sha|pr)-"))
                and (.updated_at | fromdateiso8601) < (now - $days * 86400))
              | "\(.id) \(.metadata.container.tags | join(","))"' <<< "$versions")"
            [ -n "$old" ] || { echo "$name: no preview tags older than $MAX_AGE_DAYS days."; continue; }
            while read -r id tags; do
              echo "$name: deleting version $id ($tags)"
              gh api -X DELETE "$pkg/versions/$id" < /dev/null
            done <<< "$old"
          done
