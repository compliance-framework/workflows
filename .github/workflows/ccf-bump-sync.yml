name: ccf-bump-sync

# Bumps every manifest repo's internal dependencies to their latest final releases, one PR per repo
# (cmd/ccf-bump, docs/ccf-bump.md), then merges the green ccf-bump:automerge ones (live runs only;
# ccf-bump-merge.yml merges the rest daily). Scheduled runs read repos.mock.yaml until go-live
# (W1-S4-T03) and are dry runs until the repo variable CCF_BUMP_SYNC_LIVE is "true".

on:
  schedule:
    - cron: "0 4 8,22 * *"
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest to read the repos from
        type: choice
        options: [repos.mock.yaml, repos.yaml]
        default: repos.mock.yaml
      dry_run:
        description: Print the PRs instead of opening them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ccf-bump-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    # This repo's release environment holds the ccf-release-bot secrets; only main may use it
    # (repo-settings), so a workflow on another branch can't read them.
    environment: release
    # --batch 10 waits an hour after every 10 PRs.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Select repos
        id: select
        env:
          # A scheduled run has no inputs: keep this fallback equal to the input's default.
          MANIFEST: ${{ inputs.manifest || 'repos.mock.yaml' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && vars.CCF_BUMP_SYNC_LIVE != 'true' || github.event_name != 'schedule' && inputs.dry_run }}
        run: |
          repos="$(go run ./cmd/ccf-bump list --manifest "$MANIFEST")"
          # An empty list would mint a token for every repo the app is installed on (all of them).
          if [ -z "$repos" ]; then
            echo "::error::no repos selected"
            exit 1
          fi
          {
            echo "repos=$repos"
            echo "manifest=$MANIFEST"
            echo "dry_run=$([ "$DRY_RUN" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: compliance-framework
          repositories: ${{ steps.select.outputs.repos }}
          permission-contents: ${{ steps.select.outputs.dry_run == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ steps.select.outputs.dry_run == 'true' && 'read' || 'write' }}
          # Bumps (and merging them) edit .github/workflows files; the permission has no read level, so only when live.
          permission-workflows: ${{ steps.select.outputs.dry_run != 'true' && 'write' || '' }}
          permission-checks: read # ccf-bump merge reads ci / required
      - name: Commit as the release bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
            echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"
      - name: Bump
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MANIFEST: ${{ steps.select.outputs.manifest }}
          REPOS: ${{ steps.select.outputs.repos }}
          DRY_RUN: ${{ steps.select.outputs.dry_run }}
        run: go run ./cmd/ccf-bump sync --manifest "$MANIFEST" --repos "$REPOS" --batch 10 --pr --dry-run="$DRY_RUN"
      - name: Merge green bump PRs
        # After a failed repo too: the others' PRs are open. GitHub's auto-merge can't merge them
        # (docs/ccf-bump.md#why-ccf-bump-merges-not-github).
        if: ${{ !cancelled() && steps.token.outcome == 'success' && steps.select.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          MANIFEST: ${{ steps.select.outputs.manifest }}
          REPOS: ${{ steps.select.outputs.repos }}
        run: go run ./cmd/ccf-bump merge --manifest "$MANIFEST" --repos "$REPOS" --author "${SLUG}[bot]" --wait 20m
