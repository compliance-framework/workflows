name: ccf-bump-sync

# Bumps every manifest repo's internal dependencies to their latest final releases, one PR per repo
# (cmd/ccf-bump, docs/ccf-bump.md). Scheduled runs are dry runs until the repo variable
# CCF_BUMP_SYNC_LIVE is "true".

on:
  schedule:
    - cron: "0 4 8,22 * *"
  workflow_dispatch:
    inputs:
      manifest:
        description: Manifest to read the repos from
        type: choice
        options: [repos.yaml, repos.mock.yaml]
        default: repos.yaml
      dry_run:
        description: Print the PRs instead of opening them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ccf-bump-sync
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    # --batch 10 waits an hour after every 10 PRs.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Select repos
        id: select
        env:
          MANIFEST: ${{ inputs.manifest || 'repos.yaml' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && vars.CCF_BUMP_SYNC_LIVE != 'true' || github.event_name != 'schedule' && inputs.dry_run }}
        run: |
          repos="$(go run ./cmd/ccf-bump list --manifest "$MANIFEST")"
          # An empty list would mint a token for every repo the app is installed on (all of them).
          if [ -z "$repos" ]; then
            echo "::error::no repos selected"
            exit 1
          fi
          {
            echo "repos=$repos"
            echo "manifest=$MANIFEST"
            echo "dry_run=$([ "$DRY_RUN" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: compliance-framework
          repositories: ${{ steps.select.outputs.repos }}
          permission-contents: ${{ steps.select.outputs.dry_run == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ steps.select.outputs.dry_run == 'true' && 'read' || 'write' }}
          # Bumps edit .github/workflows files; the permission has no read level, so only when live.
          permission-workflows: ${{ steps.select.outputs.dry_run != 'true' && 'write' || '' }}
          # A PR with auto-merge off asks team admins for a review (docs/attention.md).
          permission-members: ${{ steps.select.outputs.dry_run != 'true' && 'read' || '' }}
      - name: Commit as the release bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
            echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"
      - name: Bump
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MANIFEST: ${{ steps.select.outputs.manifest }}
          REPOS: ${{ steps.select.outputs.repos }}
          DRY_RUN: ${{ steps.select.outputs.dry_run }}
        run: go run ./cmd/ccf-bump sync --manifest "$MANIFEST" --repos "$REPOS" --batch 10 --pr --dry-run="$DRY_RUN"
