name: ccf-bump-sync

# Bumps every manifest repo's internal dependencies to their latest final releases, one PR per repo
# (cmd/ccf-bump, docs/ccf-bump.md), then merges the green ccf-bump:automerge ones (live runs only;
# ccf-bump-merge.yml merges the rest daily). The repos are split into chunks of 10, one job (and one
# app token, which lasts an hour) each, run one after another; a live chunk that pushed PRs waits
# out its hour before the next starts, so the org gets at most 10 bump PRs an hour. Runs read
# repos.yaml; scheduled ones are dry runs until the repo variable CCF_BUMP_SYNC_LIVE is "true".

on:
  schedule:
    - cron: "0 4 8,22 * *"
  workflow_dispatch:
    inputs:
      repos:
        description: Comma-separated subset of repos (default every active repo with release true); a dry run may name repos of an inactive batch
        type: string
        default: ""
      dry_run:
        description: Print the PRs instead of opening them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ccf-bump-sync
  cancel-in-progress: false

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chunks: ${{ steps.select.outputs.chunks }}
      manifest: ${{ steps.select.outputs.manifest }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Select repos
        id: select
        env:
          # A scheduled run has no inputs: keep these fallbacks equal to the inputs' defaults.
          MANIFEST: repos.yaml
          REPOS: ${{ inputs.repos }}
          DRY_RUN: ${{ github.event_name == 'schedule' && vars.CCF_BUMP_SYNC_LIVE != 'true' || github.event_name != 'schedule' && inputs.dry_run }}
        run: |
          dry_run="$([ "$DRY_RUN" = true ] && echo true || echo false)"
          # Only a dry run may name repos of an inactive batch (docs/manifest.md).
          chunks="$(go run ./cmd/ccf-bump list --manifest "$MANIFEST" --repos "$REPOS" --dry-run="$dry_run" --chunk 10)"
          # An empty chunk would mint a token for every repo the app is installed on (all of them).
          if ! jq -e 'length > 0 and all(.[]; .repos != "")' <<<"$chunks" >/dev/null; then
            echo "::error::no repos selected"
            exit 1
          fi
          jq -r '.[] | "chunk \(.index)/\(.of): \(.repos)"' <<<"$chunks"
          {
            echo "chunks=$chunks"
            echo "manifest=$MANIFEST"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  sync:
    name: sync ${{ matrix.chunk.index }}/${{ matrix.chunk.of }}
    needs: [select]
    runs-on: ubuntu-latest
    # This repo's release environment holds the ccf-release-bot secrets; only main may use it
    # (repo-settings), so a workflow on another branch can't read them.
    environment: release
    strategy:
      # One chunk at a time (the chunks are in stage order); a failed chunk doesn't stop the others.
      max-parallel: 1
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.select.outputs.chunks) }}
    # The bump, the 20-minute merge wait, and the pause that fills the hour.
    timeout-minutes: 120
    env:
      MANIFEST: ${{ needs.select.outputs.manifest }}
      DRY_RUN: ${{ needs.select.outputs.dry_run }}
      REPOS: ${{ matrix.chunk.repos }}
    steps:
      - name: Start the hour
        id: start
        run: echo "at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: compliance-framework
          repositories: ${{ matrix.chunk.repos }}
          permission-contents: ${{ env.DRY_RUN == 'true' && 'read' || 'write' }}
          permission-pull-requests: ${{ env.DRY_RUN == 'true' && 'read' || 'write' }}
          # Bumps (and merging them) edit .github/workflows files; the permission has no read level, so only when live.
          permission-workflows: ${{ env.DRY_RUN != 'true' && 'write' || '' }}
          permission-checks: read # ccf-bump merge reads ci / required
      - name: Commit as the release bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          {
            echo "GIT_AUTHOR_NAME=${SLUG}[bot]"
            echo "GIT_COMMITTER_NAME=${SLUG}[bot]"
            echo "GIT_AUTHOR_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
            echo "GIT_COMMITTER_EMAIL=${id}+${SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_ENV"
      - name: Bump
        id: bump
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        # A chunk has at most 10 repos, so --batch 10 never waits here; it guards a bigger chunk.
        run: go run ./cmd/ccf-bump sync --manifest "$MANIFEST" --repos "$REPOS" --batch 10 --pr --dry-run="$DRY_RUN"
      - name: Merge green bump PRs
        # After a failed repo too: the others' PRs are open. GitHub's auto-merge can't merge them
        # (docs/ccf-bump.md#why-ccf-bump-merges-not-github).
        if: ${{ !cancelled() && steps.token.outcome == 'success' && env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: go run ./cmd/ccf-bump merge --manifest "$MANIFEST" --repos "$REPOS" --author "${SLUG}[bot]" --wait 20m
      - name: Wait out the hour before the next chunk
        # Unless this chunk is known to have pushed nothing (prs=0; a Bump step that died without
        # saying may have pushed some), and not after the last one.
        if: ${{ !cancelled() && env.DRY_RUN != 'true' && steps.bump.outcome != 'skipped' && steps.bump.outputs.prs != '0' && matrix.chunk.index != matrix.chunk.of }}
        env:
          START: ${{ steps.start.outputs.at }}
          PRS: ${{ steps.bump.outputs.prs || 'an unknown number of' }}
        run: |
          left=$(( START + 3600 - $(date -u +%s) ))
          if [ "$left" -gt 0 ]; then
            echo "pushed $PRS PRs this hour; waiting ${left}s before the next chunk"
            sleep "$left"
          fi
