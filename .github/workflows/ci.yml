name: ci

on:
  pull_request:
    # labeled/unlabeled: release-checks reads the labels from the event (release:major-approved).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: Validate manifests
        run: |
          go run ./cmd/manifest --manifest repos.yaml
          go run ./cmd/manifest --manifest repos.mock.yaml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: actionlint
        # Built from source at a pinned version; shellcheck is preinstalled on the runner.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  # On this repo's release-please PRs: a new major (v2) needs the release:major-approved label.
  # The module path keeps no /vN suffix: the major is the workflows' interface, not a Go API.
  release-checks:
    uses: ./.github/workflows/release-checks.yml
    with:
      module-path: false
    permissions:
      contents: read

  # The ccf-required ruleset (repo-settings) requires the check `ci / required`, which a caller's
  # `ci` job gets from the kind workflows' `required` job. This repo calls no kind workflow, so the
  # job carries that name itself. Anything but success fails, except release-checks being skipped:
  # it only runs on release-please PRs, and a called workflow whose jobs all skip reports skipped.
  required:
    name: ci / required
    needs: [go, actionlint, release-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success")
            | select(.key != "release-checks" or .value.result != "skipped") | "\(.key): \(.value.result)"' <<< "$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::required jobs did not succeed:"
            echo "$failed"
            exit 1
          fi
          echo "All required jobs succeeded."
