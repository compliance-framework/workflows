# Publishes a policy bundle release (kind policies) when the caller's release is published:
# opa build at the given OPA version, then gooci upload-single once to
# ghcr.io/<owner>/<repo>:vX.Y.Z, and for a final tag (decided from the tag name) crane points
# :latest at that same manifest, so both tags have one digest (checked here).
# release-finished.yml reports the result. Call it on `release: published` with
# `secrets: inherit`; see README. Tag rules: internal/release (ReleaseTags).
name: release-policies

on:
  workflow_call:
    inputs:
      directory:
        description: "Directory holding the policies (the bundle root)"
        type: string
        default: policies
      opa-version:
        description: "OPA version, without the leading v"
        type: string
        default: "1.14.1"
      tag-prefix:
        description: "Prefix of the release tags"
        type: string
        default: v
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID (the caller\'s `release` environment secret is used first)"
        required: false
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key (the caller\'s `release` environment secret is used first)"
        required: false

permissions: {}

jobs:
  tags:
    name: tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - name: Check the tools ref
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so cmd/release can't be fetched"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Choose the tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
          PREFIX: ${{ inputs.tag-prefix }}
        run: go run ./cmd/release release-tags --tag "$TAG" --prefix "$PREFIX" --style artifact

  publish:
    name: publish
    needs: [tags]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ inputs.opa-version }}
      - name: opa build
        env:
          POLICY_DIR: ${{ inputs.directory }}
        run: opa build --bundle "$POLICY_DIR" --output "$RUNNER_TEMP/bundle.tar.gz"
      # gooci is built from source at a pinned version.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install gooci
        run: go install github.com/compliance-framework/gooci@v0.0.7
      # crane (go-containerregistry, the library gooci is built on) points the other tags at the
      # uploaded manifest. v0.20.7 is the newest release that needs no Go above gooci's 1.24.
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.7
      # gooci and crane read the Docker credentials (the default keychain).
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upload the bundle
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          [ -n "$TAGS" ] || { echo "::error::no tags to publish"; exit 1; }
          # Once, to the first (most specific) tag: each upload makes a new manifest, so the
          # other tags are pointed at this one by the next step.
          read -r tag _ <<<"$TAGS"
          echo "Uploading the bundle to ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
          gooci upload-single "$RUNNER_TEMP/bundle.tar.gz" "ghcr.io/${GITHUB_REPOSITORY,,}:$tag"
      # One build, one digest: the agent records the digest it pulled (_plugin_digest,
      # _policy_digest), so every tag must name the uploaded manifest (a re-upload makes another).
      - name: Tag the rest
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          read -r -a tags <<<"$TAGS"
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::no tags to publish"; exit 1; }
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest="$(crane digest "$repo:${tags[0]}")"
          [ -n "$digest" ] || { echo "::error::no digest for $repo:${tags[0]}"; exit 1; }
          for tag in "${tags[@]:1}"; do
            echo "Tagging $repo@$digest as $tag"
            crane tag "$repo@$digest" "$tag"
          done
          failed=""
          for tag in "${tags[@]}"; do
            got="$(crane digest "$repo:$tag")"
            if [ "$got" != "$digest" ]; then
              echo "::error::$repo:$tag is $got, not $digest (the upload to :${tags[0]})"
              failed=1
            fi
          done
          [ -z "$failed" ] || exit 1
          echo "$repo: ${tags[*]} all at $digest"

  finished:
    name: finished
    needs: [tags, publish]
    if: always()
    # A local reference in a called workflow resolves to this repo at the same commit (README).
    uses: ./.github/workflows/release-finished.yml
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      packages: write
    secrets:
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
