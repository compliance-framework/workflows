# Runs release-please (manifest mode: the caller's release-please-config.json and
# .release-please-manifest.json) as ccf-release-bot, so its PRs and releases trigger the
# caller's workflows. Call it on push to the default branch with `secrets: inherit`; see README.
name: release-please

on:
  workflow_call:
    secrets:
      RELEASE_BOT_APP_ID:
        description: "ccf-release-bot App ID"
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: "ccf-release-bot private key"
        required: true
    outputs:
      releases-created:
        description: "true when this run created at least one release"
        value: ${{ jobs.release-please.outputs.releases-created }}
      paths-released:
        description: "JSON list of the package paths released by this run"
        value: ${{ jobs.release-please.outputs.paths-released }}

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out release-please-config.json for the defaults check
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      # The release bot is installed on every org repo: a token minted with an owner and no
      # repositories would reach all of them, so refuse anything but this exact repo.
      - name: Check the token scope
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$REPO_NAME" ] || [ "$GITHUB_REPOSITORY" != "compliance-framework/$REPO_NAME" ]; then
            echo "::error::refusing to mint a release token: repo name '$REPO_NAME' vs $GITHUB_REPOSITORY"
            exit 1
          fi
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: compliance-framework
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # release branches, tags and releases
          permission-pull-requests: write # release PRs
          permission-issues: write # release PR labels

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release-please-config.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check the shared defaults ref
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$WORKFLOW_SHA" ]; then
            echo "::error::job.workflow_sha is empty, so the shared defaults can't be fetched"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The repo and commit this workflow file was called at (not the caller's).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ccf-workflows
          sparse-checkout: release-please/defaults.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # release-please reads its config through the API from the default branch, so the
      # defaults can't be merged in at runtime: callers copy them, and this warns on drift.
      - name: Compare the config with the shared defaults
        run: |
          config=release-please-config.json
          if [ ! -f "$config" ]; then
            echo "::warning::no $config; release-please needs one (see the workflows README)"
            exit 0
          fi
          drift="$(jq -r --slurpfile d .ccf-workflows/release-please/defaults.json \
            '. as $c | $d[0] | to_entries[] | select($c[.key] != .value) | .key' "$config")"
          for key in $drift; do
            echo "::warning file=$config::\"$key\" differs from compliance-framework/workflows release-please/defaults.json"
          done
          [ -n "$drift" ] || echo "$config has the shared defaults."

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.token.outputs.token }}
