name: preview
on: pull_request
jobs:
  preview:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@v1
    with:
      opa-version: ${{ vars.OPA_VERSION }}
  pinned:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@v1
    with:
      opa-version: 1.15.0 # plain
  newer:
    uses: compliance-framework/workflows/.github/workflows/preview.yml@v1
    with:
      opa-version: "1.16.0"
