  - {name: plugin-aws-eks-policies, kind: policies, depends_on: [agent], release: true, batch: 2}  # default branch master
  - {name: plugin-aws-eks-addon-policies, kind: policies, depends_on: [agent], release: true, batch: 2}  # default branch master
  - {name: plugin-aws-eks-nodegroup-policies, kind: policies, depends_on: [agent], release: true, batch: 2}  # default branch master
  - {name: plugin-aws-elb, kind: go-plugin, depends_on: [agent], release: true, batch: 2}
  - {name: plugin-aws-elb-listener-policies, kind: policies, depends_on: [agent], release: true, batch: 2}
