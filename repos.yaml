# Manifest of the CCF repos that the shared workflows and tools (ccf-bump, train,
# plugin-probe, repo-settings) operate on. Schema: internal/manifest/manifest.go.
# The mock repos used to develop and test the workflows live in repos.mock.yaml.

# ISO dates (YYYY-MM-DD) that are not working days; see manifest.NextWorkingWeekday.
holidays:
  - "2026-12-25"
  - "2027-01-01"

# Plugin and policy repos carry a `batch`; the tools (Renovate, ccf-bump, the train, the attention
# digest, the vulnerability summary, repo-settings' default selection) act on a batch's repos only
# once it is listed here. Repos without a batch are core and always active. See docs/manifest.md.
active_batches: [1]

# Repo name globs and explicit exclusions. They select nothing for the tools: they feed the
# coverage check (`go run ./cmd/manifest --org compliance-framework`), which fails when an
# unarchived org repo matching a pattern is neither listed below nor excluded here, or a listed
# repo is missing or archived. Archived repos are skipped, so archiving one needs only its entry
# removed. CI runs it as an advisory job that doesn't gate merges. See docs/manifest.md.
include_patterns: ["plugin-*"]
exclude:
  # Archived in workstream 2 (W2-S0-T03).
  - plugin-aws
  - plugin-sdlc
  - plugin-llm-evidence-assessor
  - plugin-azure-tags
  - plugin-kubernetes-cluster
  - plugin-kubernetes-pod
  - plugin-local-postgres
  - plugin-azure-networking-security
  - plugin-aws-budget
  - plugin-azure-db-psql
  - plugin-azure-vms
  - plugin-aws-policies
  - plugin-sdlc-policies
  - plugin-azure-tags-policies
  - plugin-kubernetes-cluster-policies
  - plugin-kubernetes-pod-policies
  - plugin-azure-networking-security-policies
  - plugin-aws-budget-policies
  - plugin-azure-db-psql-policies
  - plugin-azure-vm-policies

repos:
  - name: api
    kind: go-service
    release: true

  - name: gooci
    kind: go-lib
    release: true

  - name: agent
    kind: go-service
    depends_on: [api, gooci]
    release: true

  - name: ui
    kind: ui
    depends_on: [api]
    release: true

  - name: agent-action
    kind: action
    depends_on: [agent]
    release: true

  - name: helm-charts
    kind: helm
    depends_on: [api, ui, agent]
    release: true
    charts: [ccf-agent, ccf-app]

  # This repo: the source of the shared-workflow pins ccf-bump moves
  # (`uses: compliance-framework/workflows/.github/workflows/<f>@<sha> # vX.Y.Z`).
  # It releases itself (self-release.yml), outside the train. repo-settings gives it the same
  # settings as every other repo: every caller's CI and releases run its code.
  - name: workflows
    kind: workflows
    release: false

  # Plugins and their policy repos, by rollout batch (workstream 3). Plugins and policy repos
  # depend on agent (its runner and OPA version), so they release in agent-action's stage. The
  # tools act on a batch only once it is in active_batches (docs/manifest.md). Default branches
  # are read from GitHub; the ones marked below are master.

  # Batch 1.
  - {name: plugin-file-attestation, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-file-attestation-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-file-attestation-ctrf-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-file-attestation-sarif-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-settings, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-settings-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-repositories, kind: go-plugin, depends_on: [agent], release: true, batch: 1}  # default branch master
  - {name: plugin-github-repositories-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-repositories-custom-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-repositories-dependency-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-github-repositories-pr-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-dependabot, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-dependabot-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-dependabot-granular-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-apt-versions, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-apt-versions-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-local-ssh, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-local-ssh-policies, kind: policies, depends_on: [agent], release: true, batch: 1}  # default branch master
  - {name: plugin-jira, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-jira-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-jira-custom-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-gitlab-repositories, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-gitlab-repositories-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-k8s, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-k8s-opres-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-cloud-custodian, kind: go-plugin, depends_on: [agent], release: true, batch: 1}
  - {name: plugin-cloud-custodian-policies, kind: policies, depends_on: [agent], release: true, batch: 1}
  # Templates: new plugin and policy repos copy their workflow files; they don't release.
  - {name: plugin-template, kind: go-plugin, depends_on: [agent], release: false, batch: 1}
  - {name: plugin-template-policies, kind: policies, depends_on: [agent], release: false, batch: 1}
  - {name: policy-template, kind: policies, depends_on: [agent], release: false, batch: 1}

  # Batch 2.
  - {name: plugin-aws-rds-aurora-psql, kind: go-plugin, depends_on: [agent], release: true, batch: 2}
