  - {name: plugin-intruder, kind: go-plugin, depends_on: [agent], release: true, batch: 2}
  - {name: plugin-intruder-policies, kind: policies, depends_on: [agent], release: true, batch: 2}
  - {name: plugin-aws-acm, kind: go-plugin, depends_on: [agent], release: true, batch: 2}
