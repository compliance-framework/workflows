  - {name: plugin-aws-secretsmanager-policies, kind: policies, depends_on: [agent], release: true, batch: 2}

  # Batch 3.
  - {name: plugin-aws-vpc, kind: go-plugin, depends_on: [agent], release: true, batch: 3}
